server:
  port: ${LOCAL_PORT}
  servlet:
    context-path: ${CONTEXT_PATH}
  forward-headers-strategy: framework

spring:
  profiles.active: ${SPRING_PROFILE}
  application:
    name: fam-sub-be
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  config:
    import: optional:file:.env[.properties]
  flyway:
    # V0 is a baseline of the schema Hibernate created implicitly, so it applies
    # out of order on databases that already ran V1..V10. Every statement in it
    # is guarded and does nothing there. Once every environment has V0 recorded,
    # this can go back to the default.
    out-of-order: true
  jpa:
    # Services map entities to DTOs inside their own transactions, so nothing
    # needs the session kept open for the whole web request.
    open-in-view: false
    hibernate:
      # Migrations are the only thing allowed to change the schema. Hibernate
      # verifies the entities match at startup and refuses to boot otherwise.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: ${app.api-domain}${server.servlet.context-path}/login/oauth2/code/google

app:
  mail:
    zepto:
      api-url: https://api.zeptomail.eu/v1.1/email
      api-key: ${ZEPTO_API_KEY}
      from-address: noreply@famsub.almonium.com
      from-name: FamSub
  email:
    # Named in every email as the person to message, and as who covers
    # billing-exempt shares.
    admin-name: Олег
    reminders:
      # Saturday check-ups for debts under this go out only on the first
      # Saturday of the month (see ReminderPolicy).
      small-debt-threshold: 200
  payment:
    # Everyone pays into the Mono account that app.bank.mono reads, so every
    # payment can be recognised.
    recipient-name: Кузан Олег
    iban: UA583220010000026205363007788
    card-number: "4441111068471360"
    recipient-tax-id: ${PAYMENT_RECIPIENT_TAX_ID:}
  bank:
    mono:
      api-url: https://api.monobank.ua
      token: ${MONO_API_TOKEN:}
      # The UAH account behind app.payment above (card 444111******1360).
      account-id: eqWuI5af-i_FrRG55-eGJw
      sync-interval: PT5M
      auto-apply-tolerance: 20.00
