<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email-layout :: layout(~{::sections})}">
<body>
<th:block th:fragment="sections">

<tr><td class="fs-line" style="padding:32px 36px 28px;">
    <table th:replace="~{email-layout :: eyebrow(text=${isPaid} ? |Receipt · ${isManual ? 'one-off' : period}| : |New invoice · ${isManual ? 'one-off' : period}|, badge=${isPaid} ? 'PAID' : null)}"></table>
    <div style="height:12px; line-height:12px; font-size:0;">&nbsp;</div>
    <p th:replace="~{email-layout :: lead(text=${lead})}"></p>
    <div style="height:18px; line-height:18px; font-size:0;">&nbsp;</div>
    <div th:replace="~{email-layout :: bigAmount(amount=${invoice.totalAmount})}"></div>
    <div style="height:6px; line-height:6px; font-size:0;">&nbsp;</div>
    <p th:replace="~{email-layout :: small(text=${dateLine})}"></p>
    <th:block th:if="${isManual and invoice.notes != null}">
        <div style="height:20px; line-height:20px; font-size:0;">&nbsp;</div>
        <table th:replace="~{email-layout :: note(label='Note', text=${invoice.notes})}"></table>
    </th:block>
</td></tr>

<tr th:if="${not #lists.isEmpty(entries)}"><td class="fs-line" style="padding:26px 36px; border-top:1px solid #e4e2dc;">
    <div class="fs-muted" style="font-family:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; line-height:16px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:#4f5259;" th:text="${isPaid} ? 'What it covered' : 'What it’s for'">What it’s for</div>
    <div style="height:4px; line-height:4px; font-size:0;">&nbsp;</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; border-spacing:0;">
        <th:block th:each="entry, stat : ${entries}"><tr th:replace="~{email-layout :: line(label=${entry.subscriptionService.name}, sub=${entry.notes != null} ? |${fmt.month(entry.recordedMonth)} · ${entry.notes}| : ${fmt.month(entry.recordedMonth)}, amount=${fmt.money(entry.amount)}, first=${stat.first})}"></tr></th:block>
        <tr th:replace="~{email-layout :: line(label=${isPaid} ? 'Total, paid' : 'Invoice total', amount=${fmt.money(invoice.totalAmount)}, strong=true)}"></tr>
    </table>
</td></tr>

<th:block th:unless="${isPaid}">
    <tr><td class="fs-soft fs-line" style="padding:14px 36px; border-top:1px solid #e4e2dc; background:#faf9f7;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; border-spacing:0;">
            <tr th:replace="~{email-layout :: line(label='Your total right now', sub=${totalNote}, amount=${fmt.money(totalAmountOwed)}, first=true, strong=true)}"></tr>
        </table>
    </td></tr>
    <th:block th:if="${toPay > 0}"><tr th:replace="~{email-layout :: payBlock}"></tr></th:block>
    <tr th:replace="~{email-layout :: cardLink(text='See every invoice in this total in your cabinet', url=${cabinetUrl})}"></tr>
</th:block>
<th:block th:if="${creditLeft != null}">
    <tr><td class="fs-soft fs-line" style="padding:14px 36px; border-top:1px solid #e4e2dc; background:#faf9f7;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; border-spacing:0;">
            <tr th:replace="~{email-layout :: line(label='Credit left', sub=${creditLeft > 0} ? 'Goes toward your next invoice' : 'Your next invoice will ask you to pay', amount=${fmt.money(creditLeft)}, first=true, green=${creditLeft > 0})}"></tr>
        </table>
    </td></tr>
</th:block>
<th:block th:if="${isPaid}"><tr th:replace="~{email-layout :: cardLink(text='Your invoices are all in your cabinet', url=${cabinetUrl})}"></tr></th:block>

</th:block>
</body>
</html>
