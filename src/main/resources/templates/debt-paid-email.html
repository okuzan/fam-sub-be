<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email-layout :: layout(~{::sections})}">
<body>
<th:block th:fragment="sections">

<tr><td class="fs-line" style="padding:32px 36px 28px;">
    <table th:replace="~{email-layout :: eyebrow(text='Payment received', badge='PAID')}"></table>
    <div style="height:12px; line-height:12px; font-size:0;">&nbsp;</div>
    <div th:replace="~{email-layout :: headline(text=|Thanks, ${name}. Everything’s paid.|)}"></div>
    <div style="height:8px; line-height:8px; font-size:0;">&nbsp;</div>
    <p th:replace="~{email-layout :: small(text=${paidInvoicesCount == 1} ? 'Your open invoice is now marked paid. Nothing else to do.' : |All ${paidInvoicesCount} of your open invoices are now marked paid. Nothing else to do.|)}"></p>
</td></tr>

<tr><td class="fs-line" style="padding:26px 36px; border-top:1px solid #e4e2dc;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; border-spacing:0;">
        <tr th:replace="~{email-layout :: line(label='Invoices paid', amount=${paidInvoicesCount}, first=true)}"></tr>
        <tr th:replace="~{email-layout :: line(label='Total settled', amount=${fmt.money(totalPaidAmount)})}"></tr>
        <th:block th:if="${creditWrittenOff > 0}"><tr th:replace="~{email-layout :: line(label='Credit written off', amount=${fmt.money(creditWrittenOff)})}"></tr></th:block>
        <tr th:replace="~{email-layout :: line(label='Balance now', amount=${fmt.money(balanceAfter)}, strong=true)}"></tr>
    </table>
</td></tr>

<tr th:replace="~{email-layout :: cardLink(text='See your paid invoices in your cabinet', url=${cabinetUrl})}"></tr>

</th:block>
</body>
</html>
